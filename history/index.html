<!DOCTYPE html>
<html>
<head>
  <title>Report History</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; margin: 5px 0; background: #f5f5f5; border-radius: 4px; }
    li:hover { background: #e8e8e8; }
    a { color: #2196F3; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back { margin-top: 30px; }
  </style>
</head>
<body>
  <h1>📁 Report History</h1>
  <ul id="report-list"></ul>
  <p class="back"><a href="../index.html">← Back to main page</a></p>
  <script>
    // Generate list from folder names
    const folders = ['TIMESTAMP_PLACEHOLDER'];
    const list = document.getElementById('report-list');
    folders.forEach(folder => {
      if (folder !== 'index.html') {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = folder + '/';
        a.textContent = folder.startsWith('llm-') ? '🤖 ' + folder : '📊 ' + folder;
        li.appendChild(a);
        list.appendChild(li);
      }
    });
  </script>
</body>
</html>
